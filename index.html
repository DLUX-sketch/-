<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة محاضراتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1F2F5; --surface:#FFFFFF; --surface-2:#F6F7FA; --border:rgba(20,24,32,.09);
    --text:#181B22; --text-muted:#666F80; --text-faint:#98A0AF;
    --accent:#178A73; --accent-ink:#0E5F4F; --accent-soft:#DCEFEA;
    --warn:#D9932E; --danger:#C64B4B;
    --shadow: 0 1px 2px rgba(20,24,32,.05), 0 8px 24px -12px rgba(20,24,32,.18);
    --radius: 14px; --radius-sm: 9px;
    --sidebar-w: 252px;
  }
  html.dark{
    --bg:#11141B; --surface:#181C25; --surface-2:#1F2430; --border:rgba(255,255,255,.08);
    --text:#E7E9EE; --text-muted:#9AA2B1; --text-faint:#5E6577;
    --accent:#2BB99A; --accent-ink:#8FE3CE; --accent-soft:#1B3830;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{height:100%;}
  body{
    font-family:'Tajawal',sans-serif; background:var(--bg); color:var(--text);
    font-size:15px; -webkit-font-smoothing:antialiased;
    transition:background .25s ease, color .25s ease;
  }
  ::selection{ background:var(--accent-soft); color:var(--accent-ink); }
  a{ color:inherit; }
  button{ font-family:inherit; }
  input,textarea{ font-family:inherit; }

  .app{ display:flex; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:var(--sidebar-w); flex:0 0 var(--sidebar-w);
    background:var(--surface); border-left:1px solid var(--border);
    display:flex; flex-direction:column; padding:22px 16px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:2px 6px 22px; }
  .brand-mark{
    width:34px; height:34px; border-radius:10px; background:var(--accent);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .brand-mark svg{ width:18px; height:18px; stroke:#fff; }
  .brand-name{ font-weight:900; font-size:16.5px; letter-spacing:-.2px; }
  .brand-sub{ font-size:11px; color:var(--text-faint); margin-top:1px; }

  .nav-group-label{ font-size:11.5px; color:var(--text-faint); font-weight:700; margin:14px 10px 8px; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--radius-sm);
    cursor:pointer; margin-bottom:2px; color:var(--text-muted); font-weight:500; font-size:14px;
    border:1px solid transparent; background:none; width:100%; text-align:right;
  }
  .nav-item:hover{ background:var(--surface-2); color:var(--text); }
  .nav-item.active{ background:var(--surface-2); color:var(--text); border-color:var(--border); font-weight:700; }
  .nav-item .dot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .nav-item .lbl{ flex:1; }
  .nav-item .cnt{ font-size:11.5px; color:var(--text-faint); font-variant-numeric: tabular-nums; }
  .nav-item.active .cnt{ color:var(--accent-ink); }

  .sidebar-foot{ margin-top:auto; padding-top:14px; display:flex; flex-direction:column; gap:6px; }
  .foot-btn{
    display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:var(--radius-sm);
    background:none; border:1px solid var(--border); color:var(--text-muted); font-size:13px;
    cursor:pointer; font-weight:500;
  }
  .foot-btn:hover{ color:var(--text); background:var(--surface-2); }
  .foot-btn svg{ width:15px; height:15px; stroke:currentColor; flex:0 0 auto; }
  .auto-backup-note{ font-size:10.5px; color:var(--text-faint); padding:2px 10px 0; line-height:1.5; }

  /* ---------- Main ---------- */
  .main{ flex:1; min-width:0; padding:26px 36px 60px; max-width:1280px; margin-inline:auto; }
  .topbar{ display:flex; align-items:center; gap:14px; margin-bottom:26px; }
  .search-wrap{ position:relative; flex:1; max-width:420px; }
  .search-wrap svg{ position:absolute; inset-inline-start:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; stroke:var(--text-faint); pointer-events:none; }
  #searchInput{
    width:100%; padding:10px 38px 10px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-size:13.5px; outline:none;
  }
  #searchInput:focus{ border-color:var(--accent); }
  .theme-toggle{
    width:38px; height:38px; border-radius:10px; border:1px solid var(--border); background:var(--surface);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto;
  }
  .theme-toggle svg{ width:17px; height:17px; stroke:var(--text-muted); }

  h1.page-title{ font-size:22px; font-weight:900; margin:0 0 4px; letter-spacing:-.3px; }
  p.page-sub{ font-size:13.5px; color:var(--text-muted); margin:0 0 22px; }

  /* ---------- Today card ---------- */
  .today-card{
    background:linear-gradient(135deg, var(--accent), var(--accent-ink));
    border-radius:18px; padding:22px 24px; color:#fff; margin-bottom:26px; position:relative; overflow:hidden;
  }
  .today-card::after{
    content:""; position:absolute; inset-inline-end:-40px; top:-40px; width:180px; height:180px;
    background:rgba(255,255,255,.08); border-radius:50%;
  }
  .today-top{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; position:relative; z-index:1; }
  .today-label{ font-size:12.5px; opacity:.85; font-weight:700; }
  .today-day{ font-size:19px; font-weight:900; }
  .today-sessions{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; position:relative; z-index:1; }
  .session-chip{
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22); border-radius:12px;
    padding:10px 14px; cursor:pointer; display:flex; align-items:center; gap:9px; transition:background .15s;
  }
  .session-chip:hover{ background:rgba(255,255,255,.24); }
  .session-chip.done{ background:rgba(255,255,255,.3); border-color:rgba(255,255,255,.5); }
  .session-chip .dot{ width:9px; height:9px; border-radius:50%; background:#fff; flex:0 0 auto; }
  .session-chip .s-name{ font-weight:700; font-size:14px; }
  .session-chip .s-dur{ font-size:11.5px; opacity:.85; margin-top:1px; }
  .session-chip .s-info{ min-width:110px; }
  .s-progress-bar{ height:4px; border-radius:3px; background:rgba(255,255,255,.25); overflow:hidden; margin-top:6px; }
  .s-progress-fill{ height:100%; border-radius:3px; background:#fff; transition:width .25s ease; }
  .rest-note{ font-size:14.5px; font-weight:700; margin-top:14px; position:relative; z-index:1; }

  /* ---------- Curriculum plan box ---------- */
  .plan-box{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:26px;
  }
  .plan-title{ font-size:12.5px; color:var(--text-muted); font-weight:700; }
  .plan-big{ font-size:24px; font-weight:900; margin-top:2px; }
  .plan-sub{ font-size:12px; color:var(--text-faint); margin-top:2px; }
  .plan-rows{ margin-top:16px; display:flex; flex-direction:column; gap:12px; }
  .plan-row{ display:grid; grid-template-columns:14px 82px 150px 1fr 118px; align-items:center; gap:12px; font-size:13.5px; }
  .plan-bar{ height:8px; border-radius:5px; background:var(--surface-2); overflow:hidden; }
  .plan-bar i{ display:block; height:100%; border-radius:5px; }
  @media (max-width:820px){ .plan-row{ grid-template-columns:14px 70px 1fr 90px; } .plan-bar{ display:none; } }
  .plan-row .dot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .plan-name{ font-weight:700; }
  .plan-hours{ color:var(--text-muted); flex:1; }
  .plan-days{ font-weight:700; color:var(--accent-ink); white-space:nowrap; text-align:left; }
  .plan-warn{ font-size:12px; color:var(--danger); margin:12px 0 0; }
  .plan-note{ font-size:11px; color:var(--text-faint); margin:10px 0 0; line-height:1.6; }
  .plan-nodata{ font-size:13px; color:var(--text-muted); line-height:1.7; margin-top:2px; }

  /* ---------- Adherence strip (التزامك بالخطة) ---------- */
  .adh-wrap{ margin-top:16px; padding-top:14px; border-top:1px solid var(--border); }
  .adh-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }
  .adh-title{ font-size:12px; color:var(--text-muted); font-weight:700; }
  .adh-score{ font-size:12px; font-weight:700; }
  .adh-score.ok{ color:var(--accent-ink); }
  .adh-score.bad{ color:var(--danger); }
  .adh-days{ display:flex; gap:6px; }
  .adh-day{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; }
  .adh-dot{ width:100%; height:8px; border-radius:5px; background:var(--surface-2); }
  .adh-dot.done{ background:var(--accent); }
  .adh-dot.partial{ background:var(--warn); }
  .adh-dot.missed{ background:var(--danger); opacity:.85; }
  .adh-dot.rest{ background:var(--surface-2); background-image:repeating-linear-gradient(45deg, var(--border), var(--border) 2px, transparent 2px, transparent 5px); }
  .adh-dot.before{ background:var(--surface-2); opacity:.35; }
  .adh-dot.today{ box-shadow:0 0 0 2px var(--accent-soft); }
  .adh-lbl{ font-size:10px; color:var(--text-faint); }
  .adh-catchup{ font-size:12px; color:var(--danger); margin:10px 0 0; font-weight:700; }


  /* ---------- Subject grid (dashboard) ---------- */
  .grid-label{ font-size:12.5px; font-weight:700; color:var(--text-faint); margin:0 0 12px; }
  .subj-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; margin-bottom:8px; }
  .subj-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; cursor:pointer; transition:transform .12s, box-shadow .12s;
  }
  .subj-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow); }
  .subj-icon{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; margin-bottom:12px; }
  .subj-icon svg{ width:18px; height:18px; }
  .subj-name{ font-weight:700; font-size:15px; margin-bottom:8px; }
  .prog-bar{ height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden; margin-bottom:6px; }
  .prog-fill{ height:100%; border-radius:4px; transition:width .3s ease; }
  .subj-meta{ font-size:11.5px; color:var(--text-faint); display:flex; justify-content:space-between; }

  /* ---------- Subject view ---------- */
  .subj-header{ display:flex; align-items:center; gap:14px; margin-bottom:6px; }
  .subj-header .subj-icon{ margin-bottom:0; width:42px; height:42px; }
  .subj-header .subj-icon svg{ width:22px; height:22px; }
  .subj-header-txt h1{ margin:0; }
  .subj-progress-row{ display:flex; align-items:center; gap:10px; margin:14px 0 22px; }
  .subj-progress-row .prog-bar{ flex:1; margin:0; height:8px; }
  .subj-progress-row .pct{ font-size:13px; font-weight:700; color:var(--text-muted); white-space:nowrap; }

  .add-box{
    background:var(--surface); border:1px dashed var(--border); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:22px;
  }
  .add-box-row{ display:flex; gap:10px; }
  .add-box input[type=text]{
    flex:1; padding:10px 12px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:13.5px; outline:none;
  }
  .add-box input[type=text]:focus{ border-color:var(--accent); }
  .btn{
    padding:10px 16px; border-radius:9px; border:none; background:var(--accent); color:#fff;
    font-weight:700; font-size:13.5px; cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{ filter:brightness(1.06); }
  .btn.ghost{ background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
  .btn:disabled{ opacity:.55; cursor:default; }
  .add-hint{ font-size:11.5px; color:var(--text-faint); margin-top:9px; }
  .api-inline{ display:none; margin-top:12px; padding-top:12px; border-top:1px solid var(--border); }
  .api-inline.show{ display:block; }
  .api-inline p{ font-size:12.5px; color:var(--text-muted); margin:0 0 8px; line-height:1.7; }
  .api-inline .row{ display:flex; gap:8px; }
  .api-inline input{ flex:1; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:13px; }

  .lecture-list{ display:flex; flex-direction:column; gap:10px; }
  .lecture-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:12px; display:flex; gap:12px; align-items:flex-start; cursor:grab;
  }
  .lecture-card.dragging{ opacity:.4; }
  .lecture-card.drag-over{ border-color:var(--accent); }
  .lecture-card.watched{ background:var(--surface-2); }
  .lec-thumb{
    width:112px; height:64px; border-radius:8px; flex:0 0 auto; background:var(--surface-2);
    background-size:cover; background-position:center; cursor:pointer; position:relative; overflow:hidden;
    border:1px solid var(--border);
  }
  .lec-thumb .play-ic{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.18); opacity:0; transition:opacity .15s;
  }
  .lec-thumb:hover .play-ic{ opacity:1; }
  .lec-thumb .play-ic svg{ width:22px; height:22px; fill:#fff; }
  .lec-body{ flex:1; min-width:0; }
  .lec-title{ font-weight:700; font-size:14.5px; margin:0 0 6px; cursor:pointer; line-height:1.5; }
  .lec-title:hover{ color:var(--accent-ink); }
  .lec-note{
    width:100%; border:none; background:none; resize:none; color:var(--text-muted); font-size:12.5px;
    padding:0; outline:none; font-family:inherit; line-height:1.6;
  }
  .lec-note::placeholder{ color:var(--text-faint); }
  .lec-progress{ display:flex; align-items:center; gap:8px; margin:2px 0 8px; }
  .lec-progress-bar{ flex:1; height:4px; border-radius:3px; background:var(--surface-2); overflow:hidden; }
  .lec-progress-fill{ height:100%; border-radius:3px; background:var(--accent); transition:width .25s ease; }
  .lec-progress-text{ font-size:10.5px; color:var(--text-faint); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .lec-actions{ display:flex; align-items:center; gap:6px; flex:0 0 auto; }
  .icon-btn{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-muted);
  }
  .icon-btn:hover{ color:var(--text); }
  .icon-btn svg{ width:15px; height:15px; }
  .icon-btn.watch-btn.on{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); }
  .icon-btn.danger:hover{ color:var(--danger); border-color:var(--danger); }

  .empty{ text-align:center; padding:50px 20px; color:var(--text-faint); }
  .empty svg{ width:34px; height:34px; stroke:var(--text-faint); margin-bottom:10px; }
  .empty p{ font-size:13.5px; margin:0; }

  /* ---------- Search results ---------- */
  .search-results .lecture-card{ cursor:default; }
  .result-subj-tag{ font-size:11px; color:#fff; padding:2px 8px; border-radius:6px; display:inline-block; margin-bottom:6px; font-weight:700; }

  /* ---------- Modal player ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(8,10,14,.72); display:none; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .modal-backdrop.show{ display:flex; }
  .player-modal{ width:100%; max-width:860px; }
  .player-frame-wrap{ position:relative; width:100%; padding-top:56.25%; border-radius:14px; overflow:hidden; background:#000; }
  .player-frame-wrap iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .player-title-row{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; }
  .player-title{ color:#fff; font-weight:700; font-size:15px; }
  .close-x{ background:none; border:none; color:#fff; cursor:pointer; width:34px; height:34px; display:flex; align-items:center; justify-content:center; border-radius:8px; }
  .close-x:hover{ background:rgba(255,255,255,.12); }
  .close-x svg{ width:18px; height:18px; }

  /* ---------- Bulk add ---------- */
  .bulk-toggle{
    background:none; border:none; color:var(--accent-ink); font-size:12.5px; font-weight:700;
    cursor:pointer; padding:0; margin-top:10px; display:inline-flex; align-items:center; gap:5px;
  }
  .bulk-toggle svg{ width:13px; height:13px; }
  .bulk-box{ display:none; margin-top:12px; padding-top:12px; border-top:1px solid var(--border); }
  .bulk-box.show{ display:block; }
  .bulk-box textarea{
    width:100%; min-height:96px; padding:10px 12px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:12.5px; outline:none; resize:vertical;
    font-family:inherit; direction:ltr; text-align:left; line-height:1.6;
  }
  .bulk-box textarea:focus{ border-color:var(--accent); }
  .bulk-box p{ font-size:11.5px; color:var(--text-faint); margin:8px 0 10px; line-height:1.7; }
  .bulk-progress{ font-size:12px; color:var(--text-muted); margin-top:8px; display:none; }
  .bulk-progress.show{ display:block; }

  /* ---------- Daily pick + manual lectures ---------- */
  .pick-label{ font-size:12px; opacity:.88; font-weight:700; margin-top:14px; position:relative; z-index:1; }
  .pick-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; position:relative; z-index:1; }
  .pick{
    display:inline-flex; align-items:center; gap:7px; padding:7px 14px; border-radius:999px; cursor:pointer;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.28); color:#fff; font-weight:700; font-size:13.5px;
  }
  .pick:hover{ background:rgba(255,255,255,.22); }
  .pick .pdot{ width:8px; height:8px; border-radius:50%; background:#fff; }
  .pick.on{ background:#fff; color:var(--accent-ink); border-color:#fff; }
  .session-chip .s-lec{ font-size:11.5px; opacity:.9; margin-top:2px; max-width:210px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .finish-btn{
    border:1px solid rgba(255,255,255,.5); background:rgba(255,255,255,.18); color:#fff; border-radius:8px;
    padding:6px 10px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .finish-btn:hover{ background:rgba(255,255,255,.32); }

  .perday-row{ display:flex; align-items:center; gap:10px; margin-top:14px; font-size:13px; color:var(--text-muted); flex-wrap:wrap; }
  .seg{ display:inline-flex; border:1px solid var(--border); border-radius:9px; overflow:hidden; }
  .seg-btn{ border:none; background:var(--surface-2); color:var(--text-muted); padding:5px 14px; cursor:pointer; font-weight:700; font-size:13px; }
  .seg-btn.on{ background:var(--accent); color:#fff; }
  .perday-note{ font-size:11.5px; color:var(--text-faint); }

  .daily-set{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px; color:var(--text-muted); margin:-8px 0 18px; }
  .daily-set .hint-sm{ font-size:11.5px; color:var(--text-faint); }
  input.num{
    width:84px; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text); font-size:13px; outline:none; text-align:center;
  }
  input.num:focus{ border-color:var(--accent); }
  .manual-title{ font-size:13px; font-weight:700; margin-bottom:10px; }
  .manual-row input[type=text]{ min-width:0; }

  .lec-thumb.manual{ display:flex; align-items:center; justify-content:center; cursor:default; }
  .lec-thumb.manual svg{ width:26px; height:26px; }
  .lec-split{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:4px 0 8px; font-size:12px; color:var(--text-muted); }
  .lec-split label{ display:inline-flex; align-items:center; gap:5px; }
  .lec-split input.num{ width:64px; padding:4px 6px; font-size:12px; }
  .split-info{ color:var(--accent-ink); font-weight:700; }
  .lec-ctrl{ display:inline-flex; gap:5px; flex-wrap:wrap; }
  .mini{
    border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted); border-radius:7px;
    padding:3px 8px; font-size:11.5px; cursor:pointer; font-weight:600;
  }
  .mini:hover{ color:var(--text); }
  .mini.ok{ background:var(--accent-soft); color:var(--accent-ink); border-color:var(--accent); }

  /* ---------- Groups ---------- */
  .grp-panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:16px; }
  .grp-bar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; color:var(--text-muted); }

  /* ---------- Toast ---------- */

    border:1px solid var(--border); color:var(--text); padding:11px 18px; border-radius:10px; font-size:13px;
    box-shadow:var(--shadow); z-index:200; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
    font-weight:600;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:820px){
    .sidebar{ position:fixed; z-index:60; transform:translateX(105%); transition:transform .2s; box-shadow:var(--shadow); }
    html[dir=rtl] .sidebar.open{ transform:translateX(0); }

    .mobile-menu-btn{ display:flex !important; }

  .mobile-menu-btn{ display:none; width:38px; height:38px; border-radius:10px; border:1px solid var(--border); background:var(--surface); align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto; }
  .mobile-menu-btn svg{ width:17px; height:17px; stroke:var(--text-muted); }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:6px; }
</style>
</head>

<script>
(function(){

/* ============ DATA ============ */
const SUBJECTS = [
  { id:'chemistry', name:'كيمياء',    color:'#8B5CF6', icon:'flask' },
  { id:'biology',   name:'احياء',     color:'#22C55E', icon:'leaf' },
  { id:'math',      name:'رياضيات',  color:'#F59E0B', icon:'compass' },
];

const ICONS = {
  atom:'<circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><ellipse cx="12" cy="12" rx="9" ry="3.6"/><ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(120 12 12)"/>',
  flask:'<path d="M9 2v6.2L4.5 18a2 2 0 0 0 1.8 3h11.4a2 2 0 0 0 1.8-3L15 8.2V2"/><path d="M8 2h8"/><path d="M7.5 14h9"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  leaf:'<path d="M11 20A7 7 0 0 1 4 13c0-5 4-11 8-13 4 2 8 8 8 13a7 7 0 0 1-7 7"/><path d="M11 20c0-6 2-10 6-13"/>',
  compass:'<circle cx="12" cy="12" r="10"/><polygon points="16.2 7.8 14 14 7.8 16.2 10 10 16.2 7.8"/>',
  globe:'<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/>',
  moon:'<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 7 7 0 0 0 20 14.5z"/>',
  play:'<path d="M8 5v14l11-7z"/>',
};
function iconSvg(name, extra){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" '+(extra||'')+'>'+ICONS[name]+'</svg>'; }

const STORE_KEY = 'mlib_lectures_v1';
const SET_KEY = 'mlib_settings_v1';
const DAILY_KEY = 'mlib_daily_v1';
const LAST_BACKUP_KEY = 'mlib_last_backup_v1';
const AUTO_BACKUP_INTERVAL = 5*60*60*1000; // 5 hours

function loadLectures(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }catch(e){ return []; } }
function saveLectures(list){ localStorage.setItem(STORE_KEY, JSON.stringify(list)); }
function loadSettings(){ try{ return Object.assign({theme:'dark',perDay:2,dailyHours:{}}, JSON.parse(localStorage.getItem(SET_KEY))||{}); }catch(e){ return {theme:'dark',perDay:2,dailyHours:{}}; } }
function saveSettings(s){ localStorage.setItem(SET_KEY, JSON.stringify(s)); }
function loadDaily(){ try{ return JSON.parse(localStorage.getItem(DAILY_KEY)) || {}; }catch(e){ return {}; } }
function saveDaily(d){ localStorage.setItem(DAILY_KEY, JSON.stringify(d)); }

function todayKey(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
// Adds newly-covered seconds to today's tally for a subject (used for the daily-goal chips).
function addDailyProgress(subjectId, deltaSeconds){
  if(!deltaSeconds) return;
  const daily = loadDaily();
  const key = todayKey();
  if(!daily[key]) daily[key] = {};
  daily[key][subjectId] = Math.max(0, (daily[key][subjectId]||0) + deltaSeconds);
  saveDaily(daily);
}
// "1.5 ساعة" -> 1.5
function parseDurationHours(str){
  const m = String(str||'').match(/[\d.]+/);
  return m ? parseFloat(m[0]) : 0;
}
function formatDuration(sec){
  sec = Math.max(0, Math.round(sec||0));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  const ss = String(s).padStart(2,'0');
  return h>0 ? `${h}:${String(m).padStart(2,'0')}:${ss}` : `${m}:${ss}`;
}

let lectures = loadLectures();
let settings = loadSettings();
let currentView = 'dashboard';

/* ============ YOUTUBE PLAYER + PROGRESS TRACKING ============ */
let ytPlayer = null;
let ytPollTimer = null;
let ytApiRequested = false;
let ytApiCallbacks = [];
let currentLectureId = null;

function ensureYouTubeAPI(cb){
  if(window.YT && window.YT.Player){ cb(); return; }
  ytApiCallbacks.push(cb);
  if(!ytApiRequested){
    ytApiRequested = true;
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
    window.onYouTubeIframeAPIReady = function(){
      const cbs = ytApiCallbacks; ytApiCallbacks = [];
      cbs.forEach(fn=> fn());
    };
  }
}

// Reads each video's length from YouTube automatically (hidden muted player), one at a time.
let probeQueue = [], probing = false;
const probeFailed = new Set();
function fetchMissingDurations(){
  lectures.forEach(l=>{
    if(l.videoId && !(l.duration>0) && !probeFailed.has(l.id) && !probeQueue.includes(l.id)) probeQueue.push(l.id);
  });
  if(!probing) runProbe();
}
function runProbe(){
  const id = probeQueue.shift();
  if(!id){ probing = false; return; }
  probing = true;
  const lec = lectures.find(l=>l.id===id);
  if(!lec || lec.duration>0){ runProbe(); return; }
  ensureYouTubeAPI(()=>{
    let host = document.getElementById('ytProbeHost');
    if(!host){
      host = document.createElement('div'); host.id = 'ytProbeHost';
      host.style.cssText = 'position:fixed;left:-9999px;top:0;width:200px;height:120px;opacity:0;pointer-events:none';
      document.body.appendChild(host);
    }
    host.innerHTML = '<div id="ytProbe"></div>';
    let finished = false, timer = null, tries = 0, pl = null;
    const finish = dur=>{
      if(finished) return; finished = true;
      if(timer) clearInterval(timer);
      try{ pl && pl.destroy && pl.destroy(); }catch(e){}
      if(dur>0){
        lec.duration = Math.round(dur);
        if(lec.autoParts && !lec.grp){ lec.parts = Math.max(1, Math.round(dur/3600/subjDailyHours(lec.subjectId))); }
        saveLectures(lectures);
        renderSidebar();
        const a = document.activeElement;
        if(!(a && /INPUT|TEXTAREA/.test(a.tagName)) && currentView !== 'search') rerenderCurrent();
      } else { probeFailed.add(id); }
      setTimeout(runProbe, 150);
    };
    try{
      pl = new YT.Player('ytProbe', {
        videoId: lec.videoId, width:'200', height:'120',
        playerVars:{ rel:0, playsinline:1, autoplay:0 },
        events:{
          onReady: e=>{
            try{ e.target.mute(); }catch(x){}
            timer = setInterval(()=>{
              tries++;
              let d = 0; try{ d = e.target.getDuration(); }catch(x){}
              if(d>0) finish(d);
              else if(tries===4){ try{ e.target.playVideo(); }catch(x){} }
              else if(tries>26) finish(0);
            }, 500);
          },
          onError: ()=> finish(0)
        }
      });
    }catch(err){ finish(0); }
  });
}

function lectureProgressPct(l){
  if(!l.duration || l.duration<=0) return 0;
  return Math.max(0, Math.min(100, Math.round((l.progress||0)/l.duration*100)));
}

function createYtPlayer(lec){
  if(ytPollTimer){ clearInterval(ytPollTimer); ytPollTimer=null; }
  if(ytPlayer && ytPlayer.destroy){ try{ ytPlayer.destroy(); }catch(e){} ytPlayer=null; }
  if(!$('#ytPlayerMount')) return; // modal got closed before the API finished loading
  ytPlayer = new YT.Player('ytPlayerMount', {
    videoId: lec.videoId,
    width: '100%', height: '100%',
    playerVars: { autoplay:1, rel:0, enablejsapi:1, playsinline:1 },
    events: {
      onReady: function(e){
        const dur = e.target.getDuration();
        if(dur && dur>0) lec.duration = dur;
        if(dur && dur>0 && lec.autoParts){ lec.parts = Math.max(1, Math.round(dur/3600/subjDailyHours(lec.subjectId))); lec.autoParts = false; }
        // resume from the furthest point already reached, don't jump if basically at the start
        if(lec.progress && lec.progress>3 && dur && lec.progress < dur-3){
          try{ e.target.seekTo(lec.progress, true); }catch(err){}
        }
        saveLectures(lectures);
      },
      onStateChange: function(e){
        if(e.data === YT.PlayerState.PLAYING){
          if(ytPollTimer) clearInterval(ytPollTimer);
          ytPollTimer = setInterval(()=> pollProgress(lec.id), 2000);
        } else {
          if(ytPollTimer){ clearInterval(ytPollTimer); ytPollTimer=null; }
          pollProgress(lec.id);
          if(e.data === YT.PlayerState.ENDED) markLectureDone(lec.id);
        }
      }
    }
  });
}

// Only moves progress forward. If the user rewinds and replays something
// already counted, currentTime stays below the stored max, so nothing changes
// until they pass that point again — rewatching never inflates progress.
function pollProgress(id){
  if(!ytPlayer || !ytPlayer.getCurrentTime) return;
  const lec = lectures.find(l=>l.id===id);
  if(!lec) return;
  let time;
  try{ time = ytPlayer.getCurrentTime(); }catch(e){ return; }
  if(typeof time !== 'number' || isNaN(time)) return;
  if(time > (lec.progress||0) + 0.75){
    const delta = time - (lec.progress||0);
    lec.progress = time;
    addDailyProgress(lec.subjectId, delta);
    saveLectures(lectures);
    refreshLectureProgressBar(id);
    refreshTodayCardProgress();
    if(lec.duration && time >= lec.duration-2 && !lec.watched) markLectureDone(id);
  }
}

function markLectureDone(id){
  const lec = lectures.find(l=>l.id===id);
  if(!lec || lec.watched) return;
  if(lec.duration){
    const finalDelta = lec.duration - (lec.progress||0);
    if(finalDelta>0) addDailyProgress(lec.subjectId, finalDelta);
    lec.progress = lec.duration;
  }
  lec.watched = true;
  saveLectures(lectures);
  refreshLectureProgressBar(id);
  refreshLectureWatchState(id);
  refreshTodayCardProgress();
}

// The today-card only exists on the dashboard; no-op elsewhere.
function refreshTodayCardProgress(){
  if(currentView !== 'dashboard') return;
  const el = document.querySelector('.today-card');
  if(el){
    el.outerHTML = renderTodayCard();
    bindTodayEvents();
  }
}

function refreshLectureProgressBar(id){
  const lec = lectures.find(l=>l.id===id);
  if(!lec) return;
  const pct = lectureProgressPct(lec);
  const label = lec.duration ? `${formatDuration(lec.progress)} / ${formatDuration(lec.duration)} · ${pct}%` : `${pct}%`;
  const row = document.querySelector(`[data-progress-row="${id}"]`);
  if(row){
    row.querySelector('.lec-progress-fill').style.width = pct+'%';
    row.querySelector('.lec-progress-text').textContent = label;
    return;
  }
  const card = document.querySelector(`.lecture-card[data-id="${id}"]`);
  if(card){
    const note = card.querySelector('.lec-note');
    if(note){
      const wrap = document.createElement('div');
      wrap.innerHTML = `<div class="lec-progress" data-progress-row="${id}"><div class="lec-progress-bar"><div class="lec-progress-fill" style="width:${pct}%"></div></div><span class="lec-progress-text">${label}</span></div>`;
      note.parentNode.insertBefore(wrap.firstElementChild, note);
    }
  }
}

function refreshLectureWatchState(id){
  const lec = lectures.find(l=>l.id===id);
  if(!lec) return;
  const card = document.querySelector(`.lecture-card[data-id="${id}"]`);
  if(card){
    card.classList.toggle('watched', !!lec.watched);
    const btn = card.querySelector('.watch-btn');
    if(btn) btn.classList.toggle('on', !!lec.watched);
  }
  renderSidebar();
}

/* ============ HELPERS ============ */
const $ = (sel, root) => (root||document).querySelector(sel);
const $$ = (sel, root) => Array.from((root||document).querySelectorAll(sel));
function subjectById(id){ return SUBJECTS.find(s=>s.id===id); }
function esc(str){ const d=document.createElement('div'); d.textContent = str||''; return d.innerHTML; }

function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.classList.remove('show'), 2600);
}

function subjectStats(id){
  const list = lectures.filter(l=>l.subjectId===id);
  const watched = list.filter(l=>l.watched).length;
  const pct = list.length ? Math.round(watched/list.length*100) : 0;
  return { total:list.length, watched, pct };
}

/* ============ YOUTUBE PARSING ============ */
function parseYoutubeUrl(raw){
  let u;
  try{ u = new URL(raw.trim()); }catch(e){ return null; }
  const host = u.hostname.replace('www.','');
  if(!/youtube\.com|youtu\.be/.test(host)) return null;

  const listId = u.searchParams.get('list');
  let videoId = null;

  if(host === 'youtu.be'){
    videoId = u.pathname.slice(1).split('/')[0] || null;
  } else {
    const vParam = u.searchParams.get('v');
    if(vParam){ videoId = vParam; }
    else {
      const m = u.pathname.match(/\/(embed|shorts|live)\/([a-zA-Z0-9_-]{6,})/);
      if(m) videoId = m[2];
    }
  }

  if(u.pathname.startsWith('/playlist') || (listId && !videoId)){
    if(listId) return { type:'playlist', id:listId };
  }
  if(videoId) return { type:'video', id:videoId };
  if(listId) return { type:'playlist', id:listId };
  return null;
}

function fetchOEmbed(url){
  return fetch('https://www.youtube.com/oembed?url='+encodeURIComponent(url)+'&format=json')
    .then(r=>{ if(!r.ok) throw new Error('oembed_failed'); return r.json(); });
}

/* ============ RENDER: SIDEBAR ============ */
function renderSidebar(){
  const nav = $('#subjectNav');
  nav.innerHTML = SUBJECTS.map(s=>{
    const st = subjectStats(s.id);
    const active = currentView === ('subject:'+s.id);
    return `<button class="nav-item ${active?'active':''}" data-view="subject:${s.id}">
      <span class="dot" style="background:${s.color}"></span>
      <span class="lbl">${s.name}</span>
      <span class="cnt">${st.watched}/${st.total}</span>
    </button>`;
  }).join('');

  $$('.nav-item').forEach(el=>{
    const view = el.dataset.view;
    el.classList.toggle('active', view === currentView);
  });
}

/* ============ DAILY CHOICE + PLAN (محاضرات بالساعات، تتقسم على أيام، وانت تختار كل يوم) ============ */
const TODAY_KEY = 'mlib_today_v1'; // { 'YYYY-MM-DD': { subjId: {lecId, part, parts, targetSec} } }
function loadTodayPlan(){ try{ return JSON.parse(localStorage.getItem(TODAY_KEY)) || {}; }catch(e){ return {}; } }
function saveTodayPlan(p){ localStorage.setItem(TODAY_KEY, JSON.stringify(p)); }

function subjDailyHours(id){
  const v = settings.dailyHours && Number(settings.dailyHours[id]);
  return v > 0 ? v : 4.5;
}
function subjectLectures(id){
  return lectures.filter(l=>l.subjectId===id).sort((a,b)=> (a.order||0) - (b.order||0));
}
function nextLecture(id){ return subjectLectures(id).find(l=>!l.watched); }
function lecParts(l){ return Math.max(1, Math.round(l.parts||1)); }

// ---- Study blocks: a block = lectures studied together. Ungrouped lecture = its own block. ----
function subjectBlocks(id){
  const blocks = [], map = {};
  subjectLectures(id).forEach(l=>{
    if(l.grp){
      if(!map[l.grp]){ map[l.grp] = { key:l.grp, lecs:[], days:Math.max(1, Math.round(l.gdays||1)), group:true }; blocks.push(map[l.grp]); }
      map[l.grp].lecs.push(l);
    } else {
      blocks.push({ key:l.id, lecs:[l], days:lecParts(l), group:false });
    }
  });
  blocks.forEach(b=>{
    b.total   = b.lecs.reduce((a,l)=> a+(l.duration>0 ? l.duration : 0), 0);
    b.prog    = b.lecs.reduce((a,l)=> a+(l.duration>0 ? Math.min(l.progress||0, l.duration) : 0), 0);
    b.unknown = b.lecs.filter(l=>!(l.duration>0)).length;
    b.done    = b.lecs.every(l=>l.watched);
    b.perDay  = b.total/b.days;
    b.remDays = blockRemainingDays(b);
  });
  return blocks;
}
function blockRemainingDays(b){
  if(b.lecs.every(l=>l.watched)) return 0;
  if(!(b.total>0)) return b.days;
  const rem = b.total - b.prog;
  return Math.max(1, Math.min(b.days, Math.ceil(rem/(b.total/b.days) - 0.02)));
}
function nextBlock(id){ return subjectBlocks(id).find(b=>!b.done); }
function findBlock(sid, key){ return subjectBlocks(sid).find(b=>b.key===key); }
// What you'd study next in this block: which day-part, and how many seconds of it.
function blockToday(b){
  const part = Math.min(b.days, b.days - b.remDays + 1);
  const targetSec = b.total>0 ? Math.max(60, Math.min(b.total-b.prog, part*b.perDay - b.prog)) : 0;
  return { part, parts:b.days, targetSec };
}
// Which lectures of a block fall inside [from, from+len) seconds.
function blockLecturesInRange(b, from, len){
  let cum = 0; const out = [];
  b.lecs.forEach(l=>{
    const d = l.duration>0 ? l.duration : 0;
    if(d>0 && cum < from+len-1 && cum+d > from+1) out.push(l);
    cum += d;
  });
  return out;
}
// Push progress into the block's lectures, in order (or take it back from the end).
function addBlockProgress(sid, key, delta){
  const b = findBlock(sid, key);
  if(!b || !delta) return;
  let left = Math.abs(delta), moved = 0;
  const list = delta>0 ? b.lecs : b.lecs.slice().reverse();
  list.forEach(l=>{
    if(left<=0 || !(l.duration>0)) return;
    const cur = l.progress||0;
    const take = delta>0 ? Math.min(left, l.duration-cur) : Math.min(left, cur);
    if(take<=0) return;
    l.progress = delta>0 ? cur+take : cur-take;
    l.watched = l.progress >= l.duration-2;
    left -= take; moved += take;
  });
  if(!moved) return;
  addDailyProgress(sid, delta>0 ? moved : -moved);
  saveLectures(lectures);
  renderSidebar();
  rerenderCurrent();
}

// ---- Grouping (user picks which lectures go together, and over how many days) ----
const selected = new Set();
function groupSelected(subjId, days){
  const ids = [...selected].filter(id=> lectures.some(l=>l.id===id && l.subjectId===subjId));
  if(ids.length<1){ toast('حدد محاضرة وحدة على الأقل'); return; }
  const g = 'g'+Date.now().toString(36);
  // keep the group together in the list: pull them next to the first selected one, in current order
  const list = subjectLectures(subjId);
  const chosen = list.filter(l=>ids.includes(l.id));
  chosen.forEach(l=>{ l.grp = g; l.gdays = days; });
  const firstIdx = list.findIndex(l=>l.grp===g);
  const rest = list.filter(l=>l.grp!==g);
  rest.splice(firstIdx, 0, ...chosen);
  rest.forEach((l,i)=> l.order = i);
  selected.clear();
  saveLectures(lectures);
  renderSidebar();
  renderSubjectView(subjId);
  toast('انجمعت '+chosen.length+' محاضرة ✓');
}
function ungroup(subjId, key){
  lectures.forEach(l=>{ if(l.grp===key){ delete l.grp; delete l.gdays; l.parts = 1; } });
  saveLectures(lectures);
  renderSidebar();
  renderSubjectView(subjId);
}
function setBlockDays(subjId, key, n){
  n = Math.max(1, Math.min(60, Math.round(n)||1));
  const b = findBlock(subjId, key);
  if(!b) return;
  if(b.group) b.lecs.forEach(l=>{ l.gdays = n; });
  else { b.lecs[0].parts = n; b.lecs[0].autoParts = false; }
  saveLectures(lectures);
  renderSidebar();
  renderSubjectView(subjId);
}

// Manual progress (for lectures not watched through the built-in player, or to correct a mistake).
function addManualProgress(id, delta){
  const lec = lectures.find(l=>l.id===id);
  if(!lec) return;
  if(!(lec.duration>0)){ toast('اكتب مدة المحاضرة بالساعات أول'); return; }
  const before = lec.progress||0;
  const after = Math.max(0, Math.min(lec.duration, before+delta));
  const real = after - before;
  if(!real) return;
  lec.progress = after;
  addDailyProgress(lec.subjectId, real);
  if(after >= lec.duration-2) lec.watched = true;
  else if(lec.watched) lec.watched = false;
  saveLectures(lectures);
  renderSidebar();
  rerenderCurrent();
}
function setLectureHours(id, h){
  const lec = lectures.find(l=>l.id===id);
  if(!lec) return;
  if(h>0){
    lec.duration = Math.round(h*3600);
    lec.progress = Math.min(lec.progress||0, lec.duration);
    saveLectures(lectures);
  }
  rerenderCurrent();
}
function setLectureParts(id, n){
  const lec = lectures.find(l=>l.id===id);
  if(!lec) return;
  if(n>=1){ lec.parts = Math.min(60, n); lec.autoParts = false; saveLectures(lectures); }
  rerenderCurrent();
}

// Pick (or un-pick) a subject for today. The block + part you'll study is frozen at the moment you pick it.
function togglePick(sid){
  const tp = loadTodayPlan(), key = todayKey();
  if(!tp[key]) tp[key] = {};
  if(tp[key][sid]){
    delete tp[key][sid];
  } else {
    const b = nextBlock(sid);
    if(!b){ toast('ماكو محاضرات متبقية بهالمادة — ضيف محاضرة أول'); return; }
    if(b.unknown>0){ fetchMissingDurations(); toast('لسة دا يحسب مدة المحاضرات من اليوتيوب — جرب بعد لحظات'); return; }
    const info = blockToday(b);
    tp[key][sid] = { blockKey:b.key, part:info.part, parts:info.parts, targetSec:info.targetSec, startProg:b.prog };
  }
  saveTodayPlan(tp);
  rerenderCurrent();
}
function finishToday(sid){
  const p = (loadTodayPlan()[todayKey()]||{})[sid];
  if(!p) return;
  const done = (loadDaily()[todayKey()]||{})[sid] || 0;
  const need = p.targetSec - done;
  if(need <= 0){ toast('هذا الجزء خالص'); return; }
  addBlockProgress(sid, p.blockKey, need);
}

/* ============ RENDER: CURRICULUM PLAN ============ */
// Each lecture is split into N parts (one part per day). Every day you study at most ONE part of a given
// subject, and you choose how many subjects you do per day. Fewest possible days = the larger of
//   (a) the subject with the most parts left, and (b) total parts / subjects-per-day.
function formatSpan(days){
  const m = Math.floor(days/30), d = days%30;
  if(m<=0) return days+' يوم';
  return m+' شهر'+(d>0 ? ' و '+d+' يوم' : '');
}
function computeCurriculumPlan(){
  const per = SUBJECTS.map(s=>{
    const blocks = subjectBlocks(s.id).filter(b=>!b.done);
    const parts = blocks.reduce((a,b)=> a+b.remDays, 0);
    const hours = blocks.reduce((a,b)=> a+(b.total-b.prog)/3600, 0);
    const unknown = blocks.reduce((a,b)=> a+b.unknown, 0);
    return { subj:s, parts, hours, unknown };
  });
  const totalParts = per.reduce((a,p)=> a+p.parts, 0);
  const maxParts = per.reduce((m,p)=> Math.max(m,p.parts), 0);
  const activeCnt = per.filter(p=>p.parts>0).length;
  const perDay = Math.max(1, Math.min(settings.perDay||2, activeCnt||1));
  const days = totalParts>0 ? Math.max(maxParts, Math.ceil(totalParts/perDay)) : 0;
  return { per, totalParts, maxParts, perDay, days, unknown: per.reduce((a,p)=>a+p.unknown,0) };
}
function renderCurriculumPlan(){
  if(!lectures.some(l=> SUBJECTS.some(s=>s.id===l.subjectId))){
    return `<div class="plan-box">
      <div class="plan-title">باقيلك على أساس خطتك</div>
      <p class="plan-nodata">لسة ما ضفت ولا محاضرة. ادخل على أي مادة وضيف محاضرة (برابط يوتيوب أو بالساعات) حتى تنحسب الأيام.</p>
    </div>`;
  }
  const plan = computeCurriculumPlan();
  const finishDate = new Date();
  finishDate.setDate(finishDate.getDate()+Math.max(0,plan.days-1));
  const dateStr = finishDate.toLocaleDateString('ar-IQ', {day:'numeric', month:'long', year:'numeric'});
  const allDone = plan.totalParts===0;

  const rows = plan.per.map(p=>{
    const w = plan.maxParts>0 ? Math.round(p.parts/plan.maxParts*100) : 0;
    const daysTxt = p.parts>0 ? (p.parts+' يوم'+(p.parts===plan.maxParts ? ' ⏳' : '')) : 'خلصت ✓';
    return `<div class="plan-row">
      <span class="dot" style="background:${p.subj.color}"></span>
      <span class="plan-name">${p.subj.name}</span>
      <span class="plan-hours">${(Math.round(p.hours*10)/10)} ساعة متبقية</span>
      <span class="plan-bar"><i style="width:${w}%; background:${p.subj.color}"></i></span>
      <span class="plan-days">${daysTxt}</span>
    </div>`;
  }).join('');

  const seg = [1,2,3].map(n=>`<button class="seg-btn ${(settings.perDay||2)===n?'on':''}" data-perday="${n}">${n}</button>`).join('');

  return `<div class="plan-box">
    <div class="plan-title">باقيلك على أساس خطتك</div>
    <div class="plan-big">${allDone ? 'خلصت المنهج! 🎉' : formatSpan(plan.days)}</div>
    ${allDone ? '' : `<div class="plan-sub">(${plan.days} يوم) · تخلص تقريباً ${dateStr} إذا درست كل يوم</div>`}
    ${allDone ? '' : `<div class="plan-sub">${plan.totalParts} جزء باقي بكل المواد · جزء وحد من كل مادة باليوم</div>`}
    <div class="perday-row">
      <span>كم مادة تدرس باليوم؟</span>
      <span class="seg">${seg}</span>
      ${(settings.perDay||2) > plan.perDay && !allDone ? `<span class="perday-note">(فعلياً ${plan.perDay} لأن باقي ${plan.perDay===1?'مادة وحدة':'بس '+plan.perDay+' مواد'})</span>` : ''}
    </div>
    <div class="plan-rows">${rows}</div>
    ${!allDone ? `<p class="plan-note">🔄 كل محاضرة (أو مجموعة محاضرات جمعتها) تنحسب يوم أو أكثر حسب مدتها. إذا فوّتت يوم، الجزء يبقى وتتأخر النهاية، وإذا درست أكثر من مادة باليوم تقرب.</p>` : ''}
    ${plan.unknown>0 ? `<p class="plan-note">* ${plan.unknown} محاضرة لسة ما انحسبت مدتها (تنحسب تلقائي من اليوتيوب، تأكد من الإنترنت)، فنحسبها يوم لحد ما تنحسب.</p>` : ''}
    ${renderAdherence()}
  </div>`;
}

  $$('[data-perday]').forEach(b=> b.addEventListener('click', ()=>{
    settings.perDay = parseInt(b.dataset.perday,10);
    saveSettings(settings);

/* ============ ADHERENCE (التزامك بآخر 7 أيام) ============ */
function dateKeyForDate(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function computeAdherence(numDays){
  const daily = loadDaily(), tp = loadTodayPlan();
  const today = new Date(); today.setHours(0,0,0,0);
  let startDate = null;
  if(lectures.length){
    const earliest = Math.min(...lectures.map(l=> l.addedAt || Date.now()));
    startDate = new Date(earliest); startDate.setHours(0,0,0,0);
  }
  const days = [];
  for(let i=numDays-1;i>=0;i--){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const key = dateKeyForDate(d);
    const isToday = i===0;
    const picked = tp[key] || {};
    const sids = Object.keys(picked);
    const log = daily[key] || {};
    const anyLog = Object.values(log).some(v=>v>0);
    let status;
    if(startDate && d<startDate) status = 'before';
    else if(!sids.length) status = anyLog ? 'done' : (isToday ? 'today' : 'rest');
    else {
      const met = sids.filter(sid=> (log[sid]||0) >= picked[sid].targetSec*0.9).length;
      const full = met===sids.length;
      const any = sids.some(sid=> (log[sid]||0)>0);
      status = isToday ? (full?'done':(any?'partial':'today')) : (full?'done':(any?'partial':'missed'));
    }
    days.push({ date:d, key, status, isToday, picked });
  }
  return days;
}
function computeCatchupSeconds(days){
  const daily = loadDaily();
  let missed = 0;
  days.forEach(day=>{
    if(day.isToday || day.status==='before') return;
    const log = daily[day.key] || {};
    Object.keys(day.picked).forEach(sid=>{
      const target = day.picked[sid].targetSec, actual = log[sid]||0;
      if(actual < target*0.9) missed += (target-actual);
    });
  });
  return missed;
}
function renderAdherence(){
  const days = computeAdherence(7);
  const catchupSec = computeCatchupSeconds(days);
  const scored = days.filter(d=> !d.isToday && d.status!=='rest' && d.status!=='before');
  const doneCount = scored.filter(d=> d.status==='done').length;
  const dots = days.map(d=>{
    const lbl = d.date.toLocaleDateString('ar-IQ', {weekday:'narrow'});
    return `<div class="adh-day"><div class="adh-dot ${d.status}${d.isToday?' today':''}"></div><div class="adh-lbl">${lbl}</div></div>`;
  }).join('');
  const catchupTxt = catchupSec>0
    ? `<p class="adh-catchup">⚠️ اخترت وما خلصت تقريباً ${(catchupSec/3600).toFixed(1)} ساعة بآخر 7 أيام — حاول تعوضها.</p>`
    : '';
  return `<div class="adh-wrap">
    <div class="adh-head">
      <span class="adh-title">التزامك بآخر 7 أيام</span>
      <span class="adh-score ${catchupSec>0?'bad':'ok'}">${doneCount}/${scored.length} يوم ملتزم</span>
    </div>
    <div class="adh-days">${dots}</div>
    ${catchupTxt}
  </div>`;
}

function renderLectureList(subjId, list){
  const wrap = $('#lectureList');
  if(!list.length){
    wrap.innerHTML = `<div class="empty">${iconSvg('play')}<p>ما فيه محاضرات هسه — ألصق رابط أول محاضرة بالأعلى</p></div>`;
    return;
  }
  wrap.innerHTML = list.map(l=> lectureCardHtml(l, {select:true})).join('');
  bindLectureCardEvents(subjId);
}

function lectureCardHtml(l, opts){
  opts = opts || {};
  const subj = subjectById(l.subjectId);
  const tag = opts.showTag ? `<span class="result-subj-tag" style="background:${subj.color}">${subj.name}</span><br>` : '';
  const pct = lectureProgressPct(l);
  const timeLabel = l.duration ? `${formatDuration(l.progress)} / ${formatDuration(l.duration)} · ${pct}%` : `${pct}%`;
  const progressRow = (l.progress>0) ? `<div class="lec-progress" data-progress-row="${l.id}"><div class="lec-progress-bar"><div class="lec-progress-fill" style="width:${pct}%"></div></div><span class="lec-progress-text">${timeLabel}</span></div>` : '';
  const n = lecParts(l);
  let info = '';
  if(l.grp){ info = '📚 ضمن مجموعة'; }
  else if(l.duration>0 && !l.watched){ const b = blockRemainingDays({lecs:[l], total:l.duration, prog:Math.min(l.progress||0,l.duration), days:n}); info = `باقي ${b} يوم · ${(l.duration/n/3600).toFixed(1)} ساعة باليوم`; }
  else if(l.watched){ info = 'خلصت ✓'; }
  const ctrl = (l.duration>0 && !l.watched && !l.grp)
    ? `<span class="lec-ctrl"><button class="mini" data-addprog="${l.id}" data-sec="-1800">−30د</button><button class="mini" data-addprog="${l.id}" data-sec="1800">+30د</button><button class="mini" data-addprog="${l.id}" data-sec="3600">+1س</button></span>`
    : '';
  const durPart = l.duration>0
    ? `<span class="dur-auto">⏱ ${(l.duration/3600).toFixed(1)} ساعة</span>`
    : (l.videoId && !probeFailed.has(l.id)
        ? `<span class="dur-auto">⏱ جاري حساب المدة…</span>`
        : `<label>المدة <input type="number" class="num" min="0.1" step="0.5" data-hours="${l.id}" value="" placeholder="؟"> ساعة</label>`);
  const daysPart = l.grp ? '' : `<label>على <input type="number" class="num" min="1" max="60" data-parts="${l.id}" value="${n}"> يوم</label>`;
  const splitRow = `<div class="lec-split">
      ${durPart}
      ${daysPart}
      <span class="split-info">${info}</span>
      ${ctrl}
    </div>`;
  const selBox = opts.select ? `<label class="sel-box" title="تحديد للتجميع"><input type="checkbox" data-sel="${l.id}" ${selected.has(l.id)?'checked':''}></label>` : '';
  const thumbHtml = l.videoId
    ? `<div class="lec-thumb" style="background-image:url('${l.thumb||''}')" data-play="${l.id}"><div class="play-ic">${iconSvg('play').replace('stroke="currentColor"','stroke="#fff"')}</div></div>`
    : `<div class="lec-thumb manual" style="color:${subj.color}">${iconSvg(subj.icon)}</div>`;
  const titleAttr = l.videoId ? `data-play="${l.id}"` : '';
  return `<div class="lecture-card ${l.watched?'watched':''} ${l.grp?'grouped':''}" draggable="${opts.draggable===false?'false':'true'}" data-id="${l.id}">
    ${selBox}
    ${thumbHtml}
    <div class="lec-body">
      ${tag}
      <p class="lec-title" ${titleAttr}>${esc(l.title)}</p>
      ${progressRow}
      ${splitRow}
      <textarea class="lec-note" rows="1" placeholder="أضف ملاحظة قصيرة..." data-note="${l.id}">${esc(l.note||'')}</textarea>
    </div>
    <div class="lec-actions">
      <button class="icon-btn watch-btn ${l.watched?'on':''}" data-watch="${l.id}" title="شاهدتها">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
      <button class="icon-btn danger" data-del="${l.id}" title="حذف">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      </button>
    </div>
  </div>`;
}

function bindLectureCardEvents(subjId){
  $$('[data-hours]').forEach(el=> el.addEventListener('change', ()=> setLectureHours(el.dataset.hours, parseFloat(el.value))));
  $$('[data-parts]').forEach(el=> el.addEventListener('change', ()=> setLectureParts(el.dataset.parts, parseInt(el.value,10))));
  $$('[data-addprog]').forEach(el=> el.addEventListener('click', ()=> addManualProgress(el.dataset.addprog, parseInt(el.dataset.sec,10))));
  $$('[data-sel]').forEach(el=> el.addEventListener('change', ()=>{ if(el.checked) selected.add(el.dataset.sel); else selected.delete(el.dataset.sel); const s = document.querySelector('.grp-sel b'); if(s) s.textContent = [...selected].filter(id=> lectures.some(l=>l.id===id && l.subjectId===subjId)).length; }));
  $$('[data-play]').forEach(el=> el.addEventListener('click', ()=> openPlayer(el.dataset.play)));
  $$('[data-watch]').forEach(el=> el.addEventListener('click', ()=> toggleWatch(el.dataset.watch)));
  $$('[data-del]').forEach(el=> el.addEventListener('click', ()=> deleteLecture(el.dataset.del)));
  $$('[data-note]').forEach(el=>{
    autosize(el);
    el.addEventListener('input', ()=>{ autosize(el); });
    el.addEventListener('blur', ()=>{ updateNote(el.dataset.note, el.value); });
  });

  if(subjId){
    let dragEl = null;
    $$('.lecture-card').forEach(card=>{
      card.addEventListener('dragstart', e=>{ dragEl = card; card.classList.add('dragging'); if(e.dataTransfer){ e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain', card.dataset.id); }catch(err){} } });
      card.addEventListener('dragend', ()=>{ card.classList.remove('dragging'); $$('.lecture-card').forEach(c=>c.classList.remove('drag-over')); persistOrder(subjId); });
      card.addEventListener('dragover', e=>{
        e.preventDefault();
        if(card === dragEl) return;
        card.classList.add('drag-over');
        const list = $('#lectureList');
        const rect = card.getBoundingClientRect();
        const before = (e.clientY - rect.top) < rect.height/2;
        list.insertBefore(dragEl, before ? card : card.nextSibling);
      });
      card.addEventListener('dragleave', ()=> card.classList.remove('drag-over'));
    });
  }
}

function autosize(el){ el.style.height='auto'; el.style.height=(el.scrollHeight)+'px'; }

function persistOrder(subjId){
  const ids = $$('#lectureList .lecture-card').map(c=>c.dataset.id);
  ids.forEach((id,i)=>{
    const lec = lectures.find(l=>l.id===id);
    if(lec) lec.order = i;
  });
  saveLectures(lectures);
}

function toggleWatch(id){
  const lec = lectures.find(l=>l.id===id);
  if(!lec) return;
  lec.watched = !lec.watched;
  // Un-ticking a lecture that was fully watched must return it to "remaining";
  // before, progress stayed = duration so it still counted as 0 hours left.
  if(!lec.watched && lec.duration && (lec.progress||0) >= lec.duration-2){
    lec.progress = 0;
  }
  saveLectures(lectures);
  renderSidebar();
  rerenderCurrent();
}

function updateNote(id, val){
  const lec = lectures.find(l=>l.id===id);
  if(!lec) return;
  lec.note = val;
  saveLectures(lectures);
}

function deleteLecture(id){
  selected.delete(id);
  lectures = lectures.filter(l=>l.id!==id);
  saveLectures(lectures);
  renderSidebar();
  rerenderCurrent();
  toast('انحذفت المحاضرة');
}

function uid(){ return 'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function handleAdd(subjId){
  const input = $('#urlInput');
  const raw = input.value.trim();
  if(!raw){ toast('الصق رابط أول'); return; }
  const parsed = parseYoutubeUrl(raw);
  if(!parsed){ toast('الرابط ما يبين رابط يوتيوب صحيح'); return; }

  const addBtn = $('#addBtn');

  if(parsed.type === 'playlist'){
    toast('هذا رابط قائمة تشغيل — استخدم "إضافة عدة روابط دفعة وحدة" بالأسفل');
    $('#bulkBox').classList.add('show');
    return;
  }

  if(lectures.some(l=> l.videoId === parsed.id)){ toast('هذي المحاضرة مضافة من قبل'); return; }

  addBtn.disabled = true; addBtn.textContent = '...جاري الإضافة';
  fetchOEmbed(raw).then(data=>{
    const maxOrder = Math.max(-1, ...lectures.filter(l=>l.subjectId===subjId).map(l=>l.order||0));
    lectures.push({
      id: uid(), subjectId: subjId, title: data.title || 'محاضرة بدون عنوان',
      videoId: parsed.id, thumb: data.thumbnail_url || `https://i.ytimg.com/vi/${parsed.id}/mqdefault.jpg`,
      watched:false, note:'', order:maxOrder+1, addedAt:Date.now(), parts:1, autoParts:true
    });
    saveLectures(lectures);
    input.value='';
    renderSidebar();
    renderSubjectView(subjId);
    toast('انضافت المحاضرة ✓');
    fetchMissingDurations();
  }).catch(()=>{
    toast('ما كدرت أجيب بيانات الفيديو — تأكد من الرابط');
  }).finally(()=>{ addBtn.disabled=false; addBtn.textContent='إضافة'; });
}

function handleAddManual(subjId){
  const title = $('#mTitle').value.trim();
  const h = parseFloat($('#mHours').value);
  let parts = parseInt($('#mParts').value,10);
  if(!(h>0)){ toast('اكتب عدد الساعات'); return; }
  if(!(parts>=1)) parts = Math.max(1, Math.round(h/subjDailyHours(subjId)));
  const own = lectures.filter(l=>l.subjectId===subjId);
  const maxOrder = Math.max(-1, ...own.map(l=>l.order||0));
  lectures.push({
    id: uid(), subjectId: subjId, title: title || ('محاضرة '+(own.length+1)),
    videoId:null, thumb:'', manual:true, duration:Math.round(h*3600), progress:0, parts:Math.min(60,parts),
    watched:false, note:'', order:maxOrder+1, addedAt:Date.now()
  });
  saveLectures(lectures);
  renderSidebar();
  renderSubjectView(subjId);
  toast('انضافت المحاضرة ✓');
}

function handleBulkAdd(subjId){
  const box = $('#bulkInput');
  const lines = box.value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!lines.length){ toast('الصق روابط أول'); return; }

  const validLinks = lines.map(raw=>({ raw, parsed: parseYoutubeUrl(raw) }))
    .filter(x=> x.parsed && x.parsed.type === 'video');

  if(!validLinks.length){ toast('ما لكيت روابط فيديو صحيحة'); return; }

  // Skip videos already in the library (or repeated inside this paste) so nothing is counted twice.
  const knownIds = new Set(lectures.map(l=>l.videoId));
  let skipped = 0;
  const parsedLinks = validLinks.filter(x=>{
    if(knownIds.has(x.parsed.id)){ skipped++; return false; }
    knownIds.add(x.parsed.id);
    return true;
  });
  if(!parsedLinks.length){ toast('كل هالمحاضرات مضافة من قبل'); return; }

  const bulkBtn = $('#bulkAddBtn');
  const progress = $('#bulkProgress');
  bulkBtn.disabled = true;
  progress.classList.add('show');

  let done = 0, added = 0, failed = 0;
  let maxOrder = Math.max(-1, ...lectures.filter(l=>l.subjectId===subjId).map(l=>l.order||0));

  function updateProgress(){
    progress.textContent = `جاري الإضافة... ${done}/${parsedLinks.length} (انضاف ${added}${failed? '، فشل '+failed:''})`;
  }
  updateProgress();

  function next(i){
    if(i >= parsedLinks.length){
      saveLectures(lectures);
      renderSidebar();
      renderSubjectView(subjId);
      toast(`انضافت ${added} محاضرة${failed? ' (فشل '+failed+')':''}${skipped? ' (تخطيت '+skipped+' مكررة)':''} ✓`);
      fetchMissingDurations();
      return;
    }
    const { raw, parsed } = parsedLinks[i];
    fetchOEmbed(raw).then(data=>{
      maxOrder++;
      lectures.push({
        id: uid(), subjectId: subjId, title: data.title || 'محاضرة بدون عنوان',
        videoId: parsed.id, thumb: data.thumbnail_url || `https://i.ytimg.com/vi/${parsed.id}/mqdefault.jpg`,
        watched:false, note:'', order:maxOrder, addedAt:Date.now(), parts:1, autoParts:true
      });
      added++;
    }).catch(()=>{
      failed++;
    }).finally(()=>{
      done++;
      updateProgress();
      next(i+1);
    });
  }
  next(0);
}

function renderSearch(query){
  const q = query.trim().toLowerCase();
  const results = lectures.filter(l=> l.title.toLowerCase().includes(q));
  $('#content').innerHTML = `

    </div>
  `;
  bindLectureCardEvents(null);
}

/* ============ EXPORT / IMPORT ============ */
function doExportBackup(auto){
  const data = { lectures, daily: loadDaily(), today: loadTodayPlan(), settings:{theme:settings.theme, perDay:settings.perDay, dailyHours:settings.dailyHours}, exportedAt:new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'lectures-backup-'+new Date().toISOString().slice(0,10)+(auto?'-auto':'')+'.json';
  a.click();
  toast(auto ? 'انسوت نسخة احتياطية تلقائية ✓' : 'انحملت النسخة الاحتياطية ✓');
  localStorage.setItem(LAST_BACKUP_KEY, String(Date.now()));
  renderAutoBackupNote();
}
function renderAutoBackupNote(){
  const el = $('#autoBackupNote');
  if(!el) return;
  const last = Number(localStorage.getItem(LAST_BACKUP_KEY));
  el.textContent = last
    ? 'آخر نسخة تلقائية: '+new Date(last).toLocaleString('ar-IQ',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'})
    : 'نسخة تلقائية كل 5 ساعات (الموقع لازم يكون مفتوح بالمتصفح)';
}
// Runs while the tab is open; browsers can't silently write files in the
// background, so this can't back up while the site/tab is fully closed —
// keeping a tab open (even in another window) is what makes it fire.
function checkAutoBackup(){
  if(!lectures.length) return;
  const last = Number(localStorage.getItem(LAST_BACKUP_KEY));
  if(!last){ localStorage.setItem(LAST_BACKUP_KEY, String(Date.now())); renderAutoBackupNote(); return; }
  if(Date.now()-last >= AUTO_BACKUP_INTERVAL) doExportBackup(true);
}

$('#exportBtn').addEventListener('click', ()=> doExportBackup(false));
$('#importBtn').addEventListener('click', ()=> $('#importFile').click());
$('#importFile').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data.lectures)) throw new Error('bad format');
      lectures = data.lectures;
      saveLectures(lectures);
      if(data.daily && typeof data.daily === 'object') saveDaily(data.daily);
      if(data.today && typeof data.today === 'object') saveTodayPlan(data.today);
      if(data.settings && typeof data.settings === 'object'){ if(data.settings.perDay) settings.perDay = data.settings.perDay; if(data.settings.dailyHours) settings.dailyHours = data.settings.dailyHours; saveSettings(settings); }
      renderSidebar();
      rerenderCurrent();
      toast('انستوردت النسخة الاحتياطية ✓');
    }catch(err){
      toast('ملف غير صالح');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* ============ SEARCH BINDING ============ */
let searchDebounce;
$('#searchInput').addEventListener('input', e=>{
  clearTimeout(searchDebounce);
  const val = e.target.value;
  searchDebounce = setTimeout(()=>{
    if(val.trim()){ currentView = 'search'; renderSearch(val); renderSidebar(); }
    else { navigate('dashboard'); }
  }, 220);
});

/* ============ SIDEBAR NAV (bound once via delegation) ============ */
$('#sidebar').addEventListener('click', e=>{
  const btn = e.target.closest('.nav-item[data-view]');
  if(btn) navigate(btn.dataset.view);
});

/* ============ MOBILE MENU ============ */
$('#menuBtn').addEventListener('click', ()=> $('#sidebar').classList.toggle('open'));

/* ============ INIT ============ */
applyTheme();
renderSidebar();
renderAutoBackupNote();
checkAutoBackup();
setInterval(checkAutoBackup, 30*60*1000); // re-check every 30 min in case the tab stays open a long time
const startView = (location.hash||'').replace('#','') || 'dashboard';
navigate(startView.startsWith('subject:') ? startView : 'dashboard');
fetchMissingDurations();

})();
</script>
</body>
</html>
